<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><title>Вход, Газгольдер CRM</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14181f;--muted:#667085;--line:#e4e7ec;--accent:#3b5bdb;--bad:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0f13;--card:#161a21;--text:#e8eaee;--muted:#8b94a3;--line:#262c36;--accent:#7c9bff;--bad:#f87171}}
:root[data-theme=dark]{--bg:#0d0f13;--card:#161a21;--text:#e8eaee;--muted:#8b94a3;--line:#262c36;--accent:#7c9bff;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
form{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
h1{margin:0;font-size:20px}p{margin:0;color:var(--muted)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--bad);min-height:18px;font-size:13px}
</style></head><body>
<form id="f"><div class="logo">G</div><div><h1>Газгольдер CRM</h1><p>Войди, чтобы продолжить</p></div>
<label>Логин<input name="username" autocomplete="username" autofocus required></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
<div id="err"></div><button id="b">Войти</button></form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const f=e.target,b=document.getElementById('b'),err=document.getElementById('err');
  b.disabled=true;err.textContent='';
  try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,password:f.password.value})});
    if(r.ok){location.href='/';return}
    err.textContent=(await r.json().catch(()=>({}))).detail||'Ошибка входа'}catch{err.textContent='Нет связи с сервером'}
  b.disabled=false};
</script></body></html>
